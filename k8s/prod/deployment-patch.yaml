apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeline
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: prod
    spec:
      containers:
        - name: codeline
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi

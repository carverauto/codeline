apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeline
    spec:
      serviceAccountName: codeline
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codeline
          image: ghcr.io/carverauto/codeline:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: telnet
              containerPort: 31337
              protocol: TCP
          envFrom:
            - configMapRef:
                name: codeline-config
            - secretRef:
                name: codeline-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: telnet
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: telnet
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeline-allow-telnet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeline
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 31337
